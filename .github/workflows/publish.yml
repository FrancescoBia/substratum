# Publishes the container image to GHCR on a version tag.
#
# `:latest` is the upgrade channel — the quickstart's compose file pins it and
# the docs say `docker compose pull` — so it must only ever move on a real
# release. A manual run and a pre-release tag still publish, under their own
# name, without dragging every self-hoster along with them.
#
# Multi-arch on purpose: a single-arch image built on an Apple Silicon machine
# is arm64 only, and the quickstart's `docker compose up -d` would fail with
# `exec format error` on the amd64 VPS most self-hosters are on.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # QEMU so the amd64 runner can also produce the arm64 image.
      - uses: docker/setup-qemu-action@v3
      # The default docker driver cannot emit multi-platform manifests.
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is enough with packages: write — no PAT to create or store.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Decides the tags rather than hardcoding them, because `github.ref_name`
      # cannot tell a release from a branch: on a manual run it is the branch
      # name, and tagging that `:latest` would publish unreleased code to
      # everyone. `latest=auto` applies `:latest` only to a semver release tag,
      # and never to a pre-release.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/francescobia/substratum
          # `{{raw}}` rather than `{{version}}`: it keeps the leading `v`, which
          # is what v0.1.0 was already published as.
          tags: |
            type=semver,pattern={{raw}}
            type=ref,event=branch
          flavor: latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # better-sqlite3 compiles from source, and under emulation that is
          # slow enough to be worth caching between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
