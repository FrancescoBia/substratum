# Publishes the container image to GHCR on a version tag.
#
# Multi-arch on purpose: a single-arch image built on an Apple Silicon machine
# is arm64 only, and the quickstart's `docker compose up -d` would fail with
# `exec format error` on the amd64 VPS most self-hosters are on.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # QEMU so the amd64 runner can also produce the arm64 image.
      - uses: docker/setup-qemu-action@v3
      # The default docker driver cannot emit multi-platform manifests.
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is enough with packages: write — no PAT to create or store.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/francescobia/substratum:latest
            ghcr.io/francescobia/substratum:${{ github.ref_name }}
          # better-sqlite3 compiles from source, and under emulation that is
          # slow enough to be worth caching between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
