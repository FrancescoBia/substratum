# Actions are pinned to commit SHAs, so a moved or hijacked tag can't change
# what runs in a job that can push the image. Dependabot keeps those pins
# current, one grouped PR a week rather than one per action.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
