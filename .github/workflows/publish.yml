# Publishes the container image to GHCR on a version tag.
#
# `:latest` is the upgrade channel — the quickstart's compose file pins it and
# the docs say `docker compose pull` — so it must only ever move on a real
# release. A manual run and a pre-release tag still publish, under their own
# name, without dragging every self-hoster along with them.
#
# Multi-arch on purpose: a single-arch image built on an Apple Silicon machine
# is arm64 only, and the quickstart's `docker compose up -d` would fail with
# `exec format error` on the amd64 VPS most self-hosters are on.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One publish at a time. Two runs that both push `:latest` would otherwise race,
# and whichever finishes last wins — not whichever was pushed last. This happened
# with v0.4.1, when the tag was re-pointed while the first run was still going.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Cheap checks on the tag itself, before spending CI time on it.
  verify:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history, so the ancestry check below can see main.
          fetch-depth: 0
      # Releases come from main. Main takes direct pushes, so this isn't about
      # review — it stops a tag on a feature branch from shipping unmerged work
      # to everyone on `:latest`. Push main before (or together with) the tag:
      # `git push --atomic origin main vX.Y.Z`.
      - run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Push main first, or tag a commit that is."
            exit 1
          fi
      # The tag must sit on the commit that bumped the version. A tag pushed onto
      # the commit before the bump would otherwise ship that commit as the new
      # version.
      - run: node scripts/version.mjs check "$GITHUB_REF_NAME"

  # Branch protection cannot cover this: a `v*` tag can be pushed to any commit,
  # on any branch, and main's rules never see it. So the release gate is a job —
  # the same CI a pull request runs, against the exact commit being tagged. A
  # green run from before the tag is not evidence about the tag.
  ci:
    needs: verify
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/ci.yml

  image:
    needs: [verify, ci]
    # `verify` is skipped on a manual run, and a skipped dependency would
    # otherwise skip this job too.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # QEMU so the amd64 runner can also produce the arm64 image.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      # The default docker driver cannot emit multi-platform manifests.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # GITHUB_TOKEN is enough with packages: write — no PAT to create or store.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Decides the tags rather than hardcoding them, because `github.ref_name`
      # cannot tell a release from a branch: on a manual run it is the branch
      # name, and tagging that `:latest` would publish unreleased code to
      # everyone. `latest=auto` applies `:latest` only to a semver release tag,
      # and never to a pre-release.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/francescobia/substratum
          # `{{raw}}` rather than `{{version}}`: it keeps the leading `v`, which
          # is what v0.1.0 was already published as.
          #
          # `v0.4` follows the newest v0.4.x, for anyone who wants fixes without
          # being moved onto the next minor version. metadata-action never applies
          # it to a pre-release.
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
          flavor: latest=auto

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # better-sqlite3 compiles from source, and under emulation that is
          # slow enough to be worth caching between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The GitHub Release is where self-hosters look for what an upgrade contains,
  # so it follows the image rather than the tag: it only appears once there is
  # something to pull.
  release:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Tags and history, to find the previous release and the commits since.
          fetch-depth: 0
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      # A pre-release tag (v1.2.0-rc.1) becomes a pre-release, which GitHub
      # never marks as Latest, the same rule `:latest` follows. A re-run updates
      # the existing release instead of failing on it.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
